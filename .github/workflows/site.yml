name: Publication du site

# Publie la page sur GitHub Pages à chaque modification de la branche main
# et après chaque mise à jour mensuelle des données.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Mise à jour des données"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Préparation (sans les sources brutes)
        run: |
          mkdir -p _site
          cp -r index.html style.css *.js lib data _site/
          rm -rf _site/data/sources
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
