name: Mise à jour des données

# Retélécharge les sources (Eurostat, INSEE, ODRÉ, FAOSTAT, Our World in Data)
# et recalcule les fichiers de data/. Tous les mois, ou à la demande (onglet Actions).
on:
  schedule:
    - cron: "17 4 3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mise-a-jour
  cancel-in-progress: false

jobs:
  donnees:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: pip install openpyxl==3.1.5 xlrd==2.0.1
      - name: Téléchargement des sources
        run: |
          bash scripts/fetch.sh
          python3 scripts/fetch_regions.py
      - name: Calculs
        run: |
          python3 scripts/build.py
          python3 scripts/build_energie.py
          python3 scripts/build_matieres.py
          python3 scripts/build_territoire.py
          python3 scripts/build_themes.py
          python3 scripts/build_societe.py
          python3 scripts/build_eco2.py
          python3 scripts/build_empreinte.py
          python3 scripts/build_chomage.py
          python3 scripts/build_histoire.py
          python3 scripts/build_argent_prive.py
          python3 scripts/build_repartition.py
          python3 scripts/build_prelevements.py
          python3 scripts/build_travail_vie.py
          python3 scripts/build_niveau_vie.py
          python3 scripts/build_prosperite.py
          python3 scripts/build_exterieur.py
          python3 scripts/build_desindustrialisation.py
          python3 scripts/build_retraites.py
          python3 scripts/build_couper.py
          python3 scripts/build_logement.py
          python3 scripts/build_environnement.py
          python3 scripts/build_agriculture.py
          python3 scripts/build_patrimoine_hist.py
          python3 scripts/build_innovation.py
      - name: Enregistrement si les données ont changé
        run: |
          git config user.name "mise-a-jour-auto"
          git config user.email "actions@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "Aucune donnée nouvelle."
          else
            git commit -m "Mise à jour automatique des données ($(date -u +%Y-%m-%d))"
            git push
          fi
