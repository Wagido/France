name: Mise à jour des données

# Retélécharge les sources (Eurostat, INSEE, ODRÉ, FAOSTAT, Our World in Data)
# et recalcule les fichiers de data/. Tous les mois, ou à la demande (onglet Actions).
on:
  schedule:
    - cron: "17 4 3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mise-a-jour
  cancel-in-progress: false

jobs:
  donnees:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: pip install openpyxl==3.1.5 xlrd==2.0.1
      # Tolérance aux pannes : une source ou un calcul qui échoue garde son ancien fichier (déjà dans le dépôt),
      # le reste continue ; les échecs sont listés à la fin et font échouer le job seulement à ce moment-là.
      - name: Téléchargement des sources
        env:
          ECHECS_FICHIER: ${{ runner.temp }}/echecs.txt
        run: |
          : > "$ECHECS_FICHIER"
          bash scripts/fetch.sh || true
          if python3 scripts/fetch_regions.py; then
            python3 scripts/maj.py marquer data/sources/regions/eco2mix_regions.json
          else
            printf 'data/sources/regions/eco2mix_regions.json\tfetch_regions.py (ODRÉ) en échec\n' >> "$ECHECS_FICHIER"
            git checkout -- data/sources/regions/eco2mix_regions.json || true
          fi
      - name: Calculs
        env:
          ECHECS_FICHIER: ${{ runner.temp }}/echecs.txt
        run: |
          python3 scripts/run_builds.py
          python3 scripts/maj.py || printf 'data/maj.json\tdatation des rubriques en échec\n' >> "$ECHECS_FICHIER"
      - name: Enregistrement si les données ont changé
        run: |
          git config user.name "mise-a-jour-auto"
          git config user.email "actions@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "Aucune donnée nouvelle."
          else
            git commit -m "Mise à jour automatique des données ($(date -u +%Y-%m-%d))"
            git push
          fi
      - name: Bilan des échecs
        if: always()
        env:
          ECHECS_FICHIER: ${{ runner.temp }}/echecs.txt
        run: |
          if [ -s "$ECHECS_FICHIER" ]; then
            {
              echo "## $(wc -l < "$ECHECS_FICHIER") élément(s) non mis à jour (anciennes données conservées)"
              echo
              echo "| Fichier | Cause |"
              echo "|---|---|"
              sed 's/|/\\|/g; s/\t/ | /; s/^/| /; s/$/ |/' "$ECHECS_FICHIER"
            } >> "$GITHUB_STEP_SUMMARY"
            cat "$ECHECS_FICHIER"
            exit 1
          fi
          echo "Toutes les sources et tous les calculs ont réussi." >> "$GITHUB_STEP_SUMMARY"
